services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:?Définissez SESSION_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Définissez GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Définissez GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/google/callback}
    volumes:
      # Persiste la base SQLite et les sessions hors du conteneur.
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
